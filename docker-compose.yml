services:
  koha-db:
    image: mariadb:10.6
    container_name: koha_db
    environment:
      - MYSQL_ROOT_PASSWORD=koha_root_password
      - MYSQL_DATABASE=koha_library
      - MYSQL_USER=kohaadmin
      - MYSQL_PASSWORD=koha_db_password
    volumes:
      - koha_db_data:/var/lib/mysql

  koha-app:
    build: .
    container_name: koha_app
    privileged: true
    depends_on:
      - koha-db
    ports:
      - "3001:80"      # OPAC
      - "4000:8080"    # Staff Intranet
    environment:
      - KOHA_DBHOST=koha-db
      - KOHA_DBNAME=koha_library
      - KOHA_DBUSER=kohaadmin
      - KOHA_DBPASS=koha_db_password

volumes:
  koha_db_data:
